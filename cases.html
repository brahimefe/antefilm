<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cases — antefilm</title>
<meta name="description" content="An atlas of global cinema's political imagination, 2001 to the present. Filter by year or imagination.">
<link rel="stylesheet" href="antefilm.css">
</head>
<body>
<div class="wrap">

  <header class="bar">
    <span class="brand"><a href="index.html">ANTEFILM</a></span>
    <nav class="nav">
      <a href="index.html">home</a>
      <a href="cases.html" class="active">cases</a>
      <a href="method.html">method</a>
      <a href="about.html">about</a>
      <a href="submit.html">submit</a>
    </nav>
  </header>

  <div id="case-detail" style="display:none;"></div>

  <div id="case-list">

    <section class="cases-hd">
      <div class="kicker">— cases</div>
      <h1>An atlas of global cinema's political imagination, 2001–.</h1>
      <p id="cases-summary"></p>
    </section>

    <div class="cases-body">

      <aside class="filters">
        <div class="fgroup">
          <div class="ftit">— year</div>
          <div id="year-filters"></div>
        </div>
        <div class="fgroup">
          <div class="ftit">— imagination</div>
          <div id="imagination-filters"></div>
        </div>
      </aside>

      <div class="cases-grid" id="cases-grid"></div>

    </div>

  </div>

  <footer class="foot">
    <span>the archive grows by record</span>
    <a href="method.html">method &amp; criteria ▸</a>
  </footer>

</div>

<script src="cases.js"></script>
<script>
/* ============ STATE ============ */
let state = {
  year: null,
  imagination: null
};

/* ============ FILTERING ============ */
function getFiltered() {
  return CASES.filter(c => {
    if (c.status !== 'open') return false;
    if (state.year !== null && c.year !== state.year) return false;
    if (state.imagination !== null && c.imagination !== state.imagination) return false;
    return true;
  }).sort((a, b) => {
    if (a.year !== b.year) return a.year - b.year;
    return (b.grossNum || 0) - (a.grossNum || 0);
  });
}

/* ============ BUILD FILTERS ONCE ============ */
function buildYearFilters() {
  const el = document.getElementById('year-filters');
  el.innerHTML = '';

  const allBtn = document.createElement('div');
  allBtn.className = 'fitem act';
  allBtn.dataset.value = 'all';
  allBtn.textContent = 'all years';
  allBtn.addEventListener('click', () => selectYear(null, allBtn));
  el.appendChild(allBtn);

  allYears().forEach(y => {
    const btn = document.createElement('div');
    btn.className = 'fitem';
    btn.dataset.value = String(y);
    btn.textContent = String(y);
    btn.addEventListener('click', () => selectYear(y, btn));
    el.appendChild(btn);
  });
}

function buildImaginationFilters() {
  const el = document.getElementById('imagination-filters');
  el.innerHTML = '';

  const allBtn = document.createElement('div');
  allBtn.className = 'fitem act';
  allBtn.dataset.value = 'all';
  allBtn.textContent = 'all imaginations';
  allBtn.addEventListener('click', () => selectImagination(null, allBtn));
  el.appendChild(allBtn);

  allImaginations().forEach(i => {
    const btn = document.createElement('div');
    btn.className = 'fitem';
    btn.dataset.value = i;
    btn.textContent = i;
    btn.addEventListener('click', () => selectImagination(i, btn));
    el.appendChild(btn);
  });
}

/* ============ SELECTION ============ */
function selectYear(value, clickedEl) {
  state.year = value;
  document.querySelectorAll('#year-filters .fitem').forEach(el => el.classList.remove('act'));
  clickedEl.classList.add('act');
  renderGrid();
}

function selectImagination(value, clickedEl) {
  state.imagination = value;
  document.querySelectorAll('#imagination-filters .fitem').forEach(el => el.classList.remove('act'));
  clickedEl.classList.add('act');
  renderGrid();
}

/* ============ GRID ============ */
function renderGrid() {
  const filtered = getFiltered();
  const grid = document.getElementById('cases-grid');

  if (filtered.length === 0) {
    grid.innerHTML = `<div style="padding: 32px 24px; grid-column: 1 / -1; color: rgba(0,0,0,0.55);">No records match these filters.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(c => {
    const recCode = "REC." + String(c.recNum).padStart(3, '0');
    return `
      <a class="gcard" href="#${c.slug}">
        <div class="rec">${recCode} — ${c.year} — ${c.director}</div>
        <h3 class="ttl">${c.title}</h3>
        <div class="meta">${c.gross} / ${c.studio || ''}</div>
        <div class="img-lbl">named imagination</div>
        <p class="img">${c.imagination}</p>
      </a>
    `;
  }).join('');
}

function renderSummary() {
  const c = counts();
  document.getElementById('cases-summary').textContent =
    `${c.open} open record${c.open === 1 ? '' : 's'}. Filter by year or imagination. Filters combine.`;
}

/* ============ CASE DETAIL ============ */
function renderCaseDetail(slug) {
  const c = findCase(slug);
  const det = document.getElementById('case-detail');
  const lst = document.getElementById('case-list');

  if (!c || c.status !== 'open') {
    det.style.display = 'none';
    det.innerHTML = '';
    lst.style.display = '';
    return;
  }

  lst.style.display = 'none';
  det.style.display = '';

  const recCode = "REC." + String(c.recNum).padStart(3, '0');
  const sceneBlock = (s) => s ? `<span class="scene">${s}</span>` : '';

  det.innerHTML = `
    <section class="case-stamp">
      <div class="code">
        ${recCode}
        <span class="sep">/</span> ${c.year}
        <span class="sep">/</span> ${c.director}
        <span class="sep">·</span> FILED ${c.filed}
        <span class="open">RECORD OPEN</span>
      </div>
      <h1>${c.title}</h1>
      <p class="sub">${c.runtime} · ${c.gross} GLOBAL · ${c.studio}</p>
      <div class="img-lbl">named imagination</div>
      <p class="img">${c.imagination}</p>
    </section>

    <div class="col-heads">
      <div class="col-head l">
        <div class="tag">— camera record</div>
        <div class="desc">what the framing puts forward</div>
      </div>
      <div class="col-head r">
        <div class="tag">— ground record</div>
        <div class="desc">the same imagination, already in operation</div>
      </div>
    </div>

    <div class="rows">

      <div class="phead">— CONSTRUCTION <em>what is built as problem, what is left as given</em></div>
      <div class="cell l"><p class="body">${c.construction.camera}</p>${sceneBlock(c.construction.scene)}</div>
      <div class="cell r"><p class="body">${c.construction.ground}</p><span class="sources">${c.construction.sources}</span></div>

      <div class="phead">— ADDRESS <em>who stands in for the species</em></div>
      <div class="cell l"><p class="body">${c.address.camera}</p>${sceneBlock(c.address.scene)}</div>
      <div class="cell r"><p class="body">${c.address.ground}</p><span class="sources">${c.address.sources}</span></div>

      <div class="phead">— EXCLUSION <em>which carriers of the same keyword stay off-record</em></div>
      <div class="cell l"><p class="body">${c.exclusion.camera}</p>${sceneBlock(c.exclusion.scene)}</div>
      <div class="cell r"><p class="body">${c.exclusion.ground}</p><span class="sources">${c.exclusion.sources}</span></div>

      <div class="phead">— PRESCRIPTION <em>what the framing proposes as future-reality</em></div>
      <div class="cell l"><p class="body">${c.prescription.camera}</p>${sceneBlock(c.prescription.scene)}</div>
      <div class="cell r"><p class="body">${c.prescription.ground}</p><span class="sources">${c.prescription.sources}</span></div>

      <div class="phead">— CIRCULATION <em>the infrastructure that pre-clears the framing</em></div>
      <div class="circ-grid l">
        <div class="circ-item"><span class="k">production support</span>${c.circulation.productionSupport}</div>
        <div class="circ-item"><span class="k">script involvement</span>${c.circulation.scriptInvolvement}</div>
        <div class="circ-item"><span class="k">distribution channels</span>${c.circulation.distributionChannels}</div>
        <div class="circ-item"><span class="k">authority infrastructure</span>${c.circulation.authorityInfrastructure}</div>
      </div>
      <div class="circ-grid r">
        <div class="circ-item"><span class="k">— on the same channels</span>${c.circulation.onTheSameChannels}</div>
        <div class="circ-item"><span class="k">— off the same channels</span>${c.circulation.offTheSameChannels}</div>
        <div class="circ-sources">${c.circulation.sources}</div>
      </div>

    </div>

    <section class="gloss">
      <div class="lbl">— the imagination, named</div>
      <p class="name">${c.imagination}</p>
      <p class="text">${c.gloss}</p>
    </section>

    <div style="padding: 22px 36px; border-top: 1px solid #000; background: var(--bg);">
      <a href="#" onclick="window.location.hash=''; return false;" style="font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--signal); text-decoration: none; font-weight: 600; text-transform: uppercase;">◂ back to all cases</a>
    </div>
  `;

  window.scrollTo(0, 0);
}

/* ============ ROUTER ============ */
function route() {
  const slug = window.location.hash.replace('#', '').trim();
  if (slug) {
    renderCaseDetail(slug);
  } else {
    document.getElementById('case-detail').style.display = 'none';
    document.getElementById('case-detail').innerHTML = '';
    document.getElementById('case-list').style.display = '';
  }
}

/* ============ INIT ============ */
window.addEventListener('hashchange', route);
renderSummary();
buildYearFilters();
buildImaginationFilters();
renderGrid();
route();
</script>
</body>
</html>
